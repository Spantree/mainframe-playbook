name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  deployments: write
  packages: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Auto-deploys on push to main
    # Note: Fork PRs will be skipped — secrets are not available to forks.
    # Uncomment after creating environments in Settings > Environments:
    # environment:
    #   name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    #   url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
          registries: |
            @spantree:https://npm.pkg.github.com/|$BUN_AUTH_TOKEN

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          BUN_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          bun run build
          printf '/ /docs/about-this-playbook 301\n/docs /docs/about-this-playbook 301\n/docs/ /docs/about-this-playbook 301\n' > dist/_redirects

      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=mainframe-playbook
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
